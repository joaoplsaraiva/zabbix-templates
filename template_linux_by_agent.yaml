zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: a571c0d144b14fd4a87a9d9b2aa9fcd6
      name: 'Templates/Operating systems'
  templates:
    - uuid: 7b1e3f2a8c4d5e6f9a0b1c2d3e4f5a6b
      template: 'Linux by Zabbix Agent - JPLS'
      name: 'Linux by Zabbix Agent - JPLS'
      description: |
        Template de monitoramento Linux via Zabbix Agent.
        Monitora CPU, memória, disco, rede, processos e carga do sistema.

        Desenvolvido por João Paulo de Lima Saraiva
        Testado em: Oracle Linux 8/9, CentOS 7/8, Ubuntu 20.04/22.04, Debian 11/12
        Compatível com Zabbix 6.0 LTS e 7.0 LTS

        Repositório: https://github.com/joaoplsaraiva/zabbix-templates
      groups:
        - name: 'Templates/Operating systems'
      macros:
        - macro: '{$CPU.UTIL.CRIT}'
          value: '90'
          description: 'Limite crítico de uso de CPU em %'
        - macro: '{$CPU.UTIL.WARN}'
          value: '80'
          description: 'Limite de alerta de uso de CPU em %'
        - macro: '{$MEMORY.UTIL.MAX}'
          value: '90'
          description: 'Limite máximo de uso de memória em %'
        - macro: '{$MEMORY.UTIL.WARN}'
          value: '80'
          description: 'Limite de alerta de uso de memória em %'
        - macro: '{$SWAP.PFREE.MIN.WARN}'
          value: '20'
          description: 'Mínimo de swap livre em % para alerta'
        - macro: '{$VFS.FS.PUSED.MAX.CRIT}'
          value: '95'
          description: 'Limite crítico de uso de disco em %'
        - macro: '{$VFS.FS.PUSED.MAX.WARN}'
          value: '85'
          description: 'Limite de alerta de uso de disco em %'
        - macro: '{$LOAD.AVG.PER.CPU.MAX.WARN}'
          value: '1.5'
          description: 'Load average por CPU para alerta'
        - macro: '{$IF.UTIL.MAX}'
          value: '90'
          description: 'Limite máximo de utilização de interface de rede em %'
        - macro: '{$IF.ERRORS.WARN}'
          value: '2'
          description: 'Limite de erros de interface por segundo para alerta'
        - macro: '{$SYSTEM.FUZZYTIME.MAX}'
          value: '60'
          description: 'Diferença máxima de tempo do sistema em segundos'
      items:
        # ========================
        # CPU
        # ========================
        - uuid: a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6
          name: 'CPU: percentual de uso (iowait)'
          type: ZABBIX_ACTIVE
          key: 'system.cpu.util[,iowait]'
          delay: '60s'
          history: 7d
          trends: 365d
          units: '%'
          description: 'Percentual de tempo que a CPU fica aguardando operações de I/O'
          tags:
            - tag: component
              value: cpu
        - uuid: b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7
          name: 'CPU: percentual de uso (system)'
          type: ZABBIX_ACTIVE
          key: 'system.cpu.util[,system]'
          delay: '60s'
          history: 7d
          trends: 365d
          units: '%'
          description: 'Percentual de tempo da CPU em modo kernel'
          tags:
            - tag: component
              value: cpu
        - uuid: c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8
          name: 'CPU: percentual de uso (user)'
          type: ZABBIX_ACTIVE
          key: 'system.cpu.util[,user]'
          delay: '60s'
          history: 7d
          trends: 365d
          units: '%'
          description: 'Percentual de tempo da CPU em modo usuário'
          tags:
            - tag: component
              value: cpu
        - uuid: d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9
          name: 'CPU: percentual total de uso'
          type: ZABBIX_ACTIVE
          key: 'system.cpu.util'
          delay: '60s'
          history: 7d
          trends: 365d
          units: '%'
          description: 'Percentual total de uso de CPU'
          tags:
            - tag: component
              value: cpu
        - uuid: e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0
          name: 'CPU: load average (1 min)'
          type: ZABBIX_ACTIVE
          key: 'system.cpu.load[all,avg1]'
          delay: '60s'
          history: 7d
          trends: 365d
          description: 'Média de carga do sistema no último minuto'
          tags:
            - tag: component
              value: cpu
        - uuid: f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1
          name: 'CPU: load average (5 min)'
          type: ZABBIX_ACTIVE
          key: 'system.cpu.load[all,avg5]'
          delay: '60s'
          history: 7d
          trends: 365d
          description: 'Média de carga do sistema nos últimos 5 minutos'
          tags:
            - tag: component
              value: cpu
        - uuid: a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2
          name: 'CPU: número de CPUs lógicas'
          type: ZABBIX_ACTIVE
          key: 'system.cpu.num'
          delay: '1h'
          history: 7d
          trends: 365d
          description: 'Número de CPUs lógicas disponíveis no host'
          tags:
            - tag: component
              value: cpu
        # ========================
        # MEMÓRIA
        # ========================
        - uuid: b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3
          name: 'Memória: total disponível'
          type: ZABBIX_ACTIVE
          key: 'vm.memory.size[available]'
          delay: '60s'
          history: 7d
          trends: 365d
          units: B
          description: 'Total de memória RAM disponível em bytes'
          tags:
            - tag: component
              value: memory
        - uuid: c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4
          name: 'Memória: total instalado'
          type: ZABBIX_ACTIVE
          key: 'vm.memory.size[total]'
          delay: '1h'
          history: 7d
          trends: 365d
          units: B
          description: 'Total de memória RAM instalada em bytes'
          tags:
            - tag: component
              value: memory
        - uuid: d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5
          name: 'Memória: percentual de uso'
          type: CALCULATED
          key: 'vm.memory.util'
          delay: '60s'
          history: 7d
          trends: 365d
          units: '%'
          params: '(last("vm.memory.size[total]") - last("vm.memory.size[available]")) / last("vm.memory.size[total]") * 100'
          description: 'Percentual de memória RAM em uso'
          tags:
            - tag: component
              value: memory
        - uuid: e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6
          name: 'Swap: total disponível'
          type: ZABBIX_ACTIVE
          key: 'system.swap.size[,free]'
          delay: '60s'
          history: 7d
          trends: 365d
          units: B
          description: 'Total de swap disponível em bytes'
          tags:
            - tag: component
              value: memory
        - uuid: f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7
          name: 'Swap: percentual livre'
          type: ZABBIX_ACTIVE
          key: 'system.swap.size[,pfree]'
          delay: '60s'
          history: 7d
          trends: 365d
          units: '%'
          description: 'Percentual de swap livre'
          tags:
            - tag: component
              value: memory
        # ========================
        # DISCO
        # ========================
        - uuid: a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8
          name: 'Disco /: espaço total'
          type: ZABBIX_ACTIVE
          key: 'vfs.fs.size[/,total]'
          delay: '1h'
          history: 7d
          trends: 365d
          units: B
          description: 'Espaço total em disco na partição raiz'
          tags:
            - tag: component
              value: storage
        - uuid: b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9
          name: 'Disco /: espaço usado'
          type: ZABBIX_ACTIVE
          key: 'vfs.fs.size[/,used]'
          delay: '60s'
          history: 7d
          trends: 365d
          units: B
          description: 'Espaço utilizado em disco na partição raiz'
          tags:
            - tag: component
              value: storage
        - uuid: c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0
          name: 'Disco /: percentual de uso'
          type: ZABBIX_ACTIVE
          key: 'vfs.fs.size[/,pused]'
          delay: '60s'
          history: 7d
          trends: 365d
          units: '%'
          description: 'Percentual de disco utilizado na partição raiz'
          tags:
            - tag: component
              value: storage
        - uuid: d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1
          name: 'Disco: operações de leitura por segundo'
          type: ZABBIX_ACTIVE
          key: 'vfs.dev.read[,ops]'
          delay: '60s'
          history: 7d
          trends: 365d
          units: ops
          description: 'Número de operações de leitura em disco por segundo'
          tags:
            - tag: component
              value: storage
        - uuid: e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2
          name: 'Disco: operações de escrita por segundo'
          type: ZABBIX_ACTIVE
          key: 'vfs.dev.write[,ops]'
          delay: '60s'
          history: 7d
          trends: 365d
          units: ops
          description: 'Número de operações de escrita em disco por segundo'
          tags:
            - tag: component
              value: storage
        # ========================
        # REDE
        # ========================
        - uuid: f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2c3
          name: 'Rede: bytes recebidos por segundo'
          type: ZABBIX_ACTIVE
          key: 'net.if.in[eth0]'
          delay: '60s'
          history: 7d
          trends: 365d
          units: bps
          description: 'Taxa de bytes recebidos pela interface eth0 (ajuste o nome da interface se necessário)'
          preprocessing:
            - type: CHANGE_PER_SECOND
              parameters:
                - ''
          tags:
            - tag: component
              value: network
        - uuid: a9b0c1d2e3f4a5b6c7d8e9f0a1b2c3d4
          name: 'Rede: bytes enviados por segundo'
          type: ZABBIX_ACTIVE
          key: 'net.if.out[eth0]'
          delay: '60s'
          history: 7d
          trends: 365d
          units: bps
          description: 'Taxa de bytes enviados pela interface eth0 (ajuste o nome da interface se necessário)'
          preprocessing:
            - type: CHANGE_PER_SECOND
              parameters:
                - ''
          tags:
            - tag: component
              value: network
        # ========================
        # SISTEMA
        # ========================
        - uuid: b0c1d2e3f4a5b6c7d8e9f0a1b2c3d4e5
          name: 'Sistema: uptime'
          type: ZABBIX_ACTIVE
          key: 'system.uptime'
          delay: '60s'
          history: 7d
          trends: 365d
          units: uptime
          description: 'Tempo desde o último boot do servidor'
          tags:
            - tag: component
              value: system
        - uuid: c1d2e3f4a5b6c7d8e9f0a1b2c3d4e5f6
          name: 'Sistema: nome do host'
          type: ZABBIX_ACTIVE
          key: 'system.hostname'
          delay: '1h'
          history: 7d
          trends: '0'
          value_type: CHAR
          description: 'Nome do host configurado no sistema operacional'
          tags:
            - tag: component
              value: system
        - uuid: d2e3f4a5b6c7d8e9f0a1b2c3d4e5f6a7
          name: 'Sistema: versão do OS'
          type: ZABBIX_ACTIVE
          key: 'system.sw.os'
          delay: '1h'
          history: 7d
          trends: '0'
          value_type: CHAR
          description: 'Versão do sistema operacional'
          tags:
            - tag: component
              value: system
        - uuid: e3f4a5b6c7d8e9f0a1b2c3d4e5f6a7b8
          name: 'Sistema: número de processos em execução'
          type: ZABBIX_ACTIVE
          key: 'proc.num'
          delay: '60s'
          history: 7d
          trends: 365d
          description: 'Total de processos em execução no sistema'
          tags:
            - tag: component
              value: system
        - uuid: f4a5b6c7d8e9f0a1b2c3d4e5f6a7b8c9
          name: 'Agente Zabbix: disponibilidade'
          type: ZABBIX_INTERNAL
          key: 'zabbix[host,agent,available]'
          delay: '60s'
          history: 7d
          trends: 365d
          description: 'Status de disponibilidade do agente Zabbix no host'
          tags:
            - tag: component
              value: zabbix
      triggers:
        - uuid: a5b6c7d8e9f0a1b2c3d4e5f6a7b8c9d0
          expression: 'avg(/Linux by Zabbix Agent - JPLS/system.cpu.util,5m) >= {$CPU.UTIL.CRIT}'
          name: 'CPU: uso crítico alto (> {$CPU.UTIL.CRIT}%) em {HOST.NAME}'
          opdata: 'Uso atual: {ITEM.LASTVALUE}'
          priority: HIGH
          description: 'O uso de CPU está acima do limite crítico por mais de 5 minutos.'
          tags:
            - tag: scope
              value: performance
        - uuid: b6c7d8e9f0a1b2c3d4e5f6a7b8c9d0e1
          expression: 'avg(/Linux by Zabbix Agent - JPLS/system.cpu.util,5m) >= {$CPU.UTIL.WARN} and avg(/Linux by Zabbix Agent - JPLS/system.cpu.util,5m) < {$CPU.UTIL.CRIT}'
          name: 'CPU: uso elevado (> {$CPU.UTIL.WARN}%) em {HOST.NAME}'
          opdata: 'Uso atual: {ITEM.LASTVALUE}'
          priority: WARNING
          description: 'O uso de CPU está acima do limite de alerta.'
          dependencies:
            - name: 'CPU: uso crítico alto (> {$CPU.UTIL.CRIT}%) em {HOST.NAME}'
              expression: 'avg(/Linux by Zabbix Agent - JPLS/system.cpu.util,5m) >= {$CPU.UTIL.CRIT}'
          tags:
            - tag: scope
              value: performance
        - uuid: c7d8e9f0a1b2c3d4e5f6a7b8c9d0e1f2
          expression: 'last(/Linux by Zabbix Agent - JPLS/vm.memory.util) >= {$MEMORY.UTIL.MAX}'
          name: 'Memória: uso crítico alto (> {$MEMORY.UTIL.MAX}%) em {HOST.NAME}'
          opdata: 'Disponível: {ITEM.LASTVALUE}'
          priority: HIGH
          description: 'O uso de memória RAM está acima do limite crítico.'
          tags:
            - tag: scope
              value: capacity
        - uuid: d8e9f0a1b2c3d4e5f6a7b8c9d0e1f2a3
          expression: 'last(/Linux by Zabbix Agent - JPLS/vm.memory.util) >= {$MEMORY.UTIL.WARN} and last(/Linux by Zabbix Agent - JPLS/vm.memory.util) < {$MEMORY.UTIL.MAX}'
          name: 'Memória: uso elevado (> {$MEMORY.UTIL.WARN}%) em {HOST.NAME}'
          opdata: 'Uso atual: {ITEM.LASTVALUE}'
          priority: WARNING
          description: 'O uso de memória RAM está acima do limite de alerta.'
          dependencies:
            - name: 'Memória: uso crítico alto (> {$MEMORY.UTIL.MAX}%) em {HOST.NAME}'
              expression: 'last(/Linux by Zabbix Agent - JPLS/vm.memory.util) >= {$MEMORY.UTIL.MAX}'
          tags:
            - tag: scope
              value: capacity
        - uuid: e9f0a1b2c3d4e5f6a7b8c9d0e1f2a3b4
          expression: 'last(/Linux by Zabbix Agent - JPLS/vfs.fs.size[/,pused]) >= {$VFS.FS.PUSED.MAX.CRIT}'
          name: 'Disco /: uso crítico de espaço (> {$VFS.FS.PUSED.MAX.CRIT}%) em {HOST.NAME}'
          opdata: 'Espaço livre: {ITEM.LASTVALUE}'
          priority: HIGH
          description: 'O espaço em disco na partição raiz está acima do limite crítico.'
          tags:
            - tag: scope
              value: capacity
        - uuid: f0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5
          expression: 'last(/Linux by Zabbix Agent - JPLS/vfs.fs.size[/,pused]) >= {$VFS.FS.PUSED.MAX.WARN} and last(/Linux by Zabbix Agent - JPLS/vfs.fs.size[/,pused]) < {$VFS.FS.PUSED.MAX.CRIT}'
          name: 'Disco /: uso elevado de espaço (> {$VFS.FS.PUSED.MAX.WARN}%) em {HOST.NAME}'
          opdata: 'Uso atual: {ITEM.LASTVALUE}'
          priority: WARNING
          description: 'O espaço em disco na partição raiz está acima do limite de alerta.'
          dependencies:
            - name: 'Disco /: uso crítico de espaço (> {$VFS.FS.PUSED.MAX.CRIT}%) em {HOST.NAME}'
              expression: 'last(/Linux by Zabbix Agent - JPLS/vfs.fs.size[/,pused]) >= {$VFS.FS.PUSED.MAX.CRIT}'
          tags:
            - tag: scope
              value: capacity
        - uuid: a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d7
          expression: 'last(/Linux by Zabbix Agent - JPLS/system.swap.size[,pfree]) < {$SWAP.PFREE.MIN.WARN}'
          name: 'Swap: espaço livre abaixo do limite ({$SWAP.PFREE.MIN.WARN}%) em {HOST.NAME}'
          opdata: 'Swap livre: {ITEM.LASTVALUE}'
          priority: WARNING
          description: 'O espaço de swap livre está abaixo do limite mínimo configurado.'
          tags:
            - tag: scope
              value: capacity
        - uuid: b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e8
          expression: 'last(/Linux by Zabbix Agent - JPLS/system.uptime) < 600'
          name: 'Sistema: host reiniciado há menos de 10 minutos ({HOST.NAME})'
          priority: WARNING
          description: 'O host foi reiniciado recentemente. Verifique se foi intencional.'
          tags:
            - tag: scope
              value: availability
        - uuid: c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f9
          expression: 'last(/Linux by Zabbix Agent - JPLS/zabbix[host,agent,available]) = 0'
          name: 'Agente Zabbix: indisponível em {HOST.NAME}'
          priority: HIGH
          description: 'O agente Zabbix não responde. Verifique conectividade e serviço do agente.'
          tags:
            - tag: scope
              value: availability
      graphs:
        - uuid: d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a0
          name: 'CPU: uso geral'
          graph_items:
            - sortorder: '0'
              color: E6002D
              item:
                host: 'Linux by Zabbix Agent - JPLS'
                key: 'system.cpu.util'
            - sortorder: '1'
              color: F63100
              item:
                host: 'Linux by Zabbix Agent - JPLS'
                key: 'system.cpu.util[,user]'
            - sortorder: '2'
              color: 0080FF
              item:
                host: 'Linux by Zabbix Agent - JPLS'
                key: 'system.cpu.util[,system]'
            - sortorder: '3'
              color: FFAD00
              item:
                host: 'Linux by Zabbix Agent - JPLS'
                key: 'system.cpu.util[,iowait]'
        - uuid: e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b1
          name: 'Memória: uso e disponibilidade'
          graph_items:
            - sortorder: '0'
              color: 0080FF
              item:
                host: 'Linux by Zabbix Agent - JPLS'
                key: 'vm.memory.size[total]'
            - sortorder: '1'
              color: 00CC00
              item:
                host: 'Linux by Zabbix Agent - JPLS'
                key: 'vm.memory.size[available]'
        - uuid: f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c2
          name: 'Disco /: uso de espaço'
          graph_items:
            - sortorder: '0'
              color: E6002D
              item:
                host: 'Linux by Zabbix Agent - JPLS'
                key: 'vfs.fs.size[/,used]'
            - sortorder: '1'
              color: 00CC00
              item:
                host: 'Linux by Zabbix Agent - JPLS'
                key: 'vfs.fs.size[/,total]'
        - uuid: a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d3
          name: 'Rede: tráfego eth0'
          graph_items:
            - sortorder: '0'
              color: 00CC00
              item:
                host: 'Linux by Zabbix Agent - JPLS'
                key: 'net.if.in[eth0]'
            - sortorder: '1'
              color: 0080FF
              item:
                host: 'Linux by Zabbix Agent - JPLS'
                key: 'net.if.out[eth0]'
