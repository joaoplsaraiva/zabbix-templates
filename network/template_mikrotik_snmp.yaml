zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: c683d244b24fd4a87a9d9b3bb9fcd812
      name: 'Templates/Network devices'
  templates:
    - uuid: 9d3e5b4c0f6a7b8c1d2e3f4a5b6c7d8e
      template: 'MikroTik SNMP - JPLS'
      name: 'MikroTik SNMP - JPLS'
      description: |
        Template de monitoramento completo para roteadores MikroTik via SNMP v2c.
        Cobre: sistema, CPU, memória, interfaces de rede, roteamento, wireless,
        VPN (L2TP/PPTP/SSTP), firewall, temperatura e detecção de firmware desatualizado.

        Desenvolvido por João Paulo de Lima Saraiva
        Baseado em experiência real com MikroTik na SEFA/PA e certificação:
          Mikrotik Mod I — Introducao a Ferramenta e suas Principais Utilizacoes
          SENAI/CEDAM — 60h (2019)

        Testado em: RouterOS 6.x e 7.x
        Compatível com Zabbix 6.0 LTS e 7.0 LTS

        Pré-requisito: SNMP v2c habilitado no MikroTik
          /snmp set enabled=yes community=PUBLIC contact="" location=""

        Repositório: https://github.com/joaoplsaraiva/zabbix-templates
      groups:
        - name: 'Templates/Network devices'
      macros:
        - macro: '{$SNMP.COMMUNITY}'
          value: 'PUBLIC'
          description: 'Community SNMP v2c configurada no MikroTik (/snmp set community=...)'
        - macro: '{$SNMP.TIMEOUT}'
          value: '5s'
          description: 'Timeout das requisições SNMP'
        - macro: '{$CPU.UTIL.WARN}'
          value: '80'
          description: 'Limite de alerta de uso de CPU em %'
        - macro: '{$CPU.UTIL.CRIT}'
          value: '95'
          description: 'Limite crítico de uso de CPU em %'
        - macro: '{$MEMORY.UTIL.WARN}'
          value: '80'
          description: 'Limite de alerta de uso de memória em %'
        - macro: '{$MEMORY.UTIL.CRIT}'
          value: '95'
          description: 'Limite crítico de uso de memória em %'
        - macro: '{$IF.UTIL.WARN}'
          value: '80'
          description: 'Limite de alerta de utilização de interface em %'
        - macro: '{$IF.ERRORS.WARN}'
          value: '2'
          description: 'Erros de interface por segundo para alerta'
        - macro: '{$TEMP.MAX.WARN}'
          value: '60'
          description: 'Temperatura máxima em °C para alerta (varia por modelo)'
        - macro: '{$TEMP.MAX.CRIT}'
          value: '75'
          description: 'Temperatura crítica em °C'
        - macro: '{$VPN.SESSIONS.MAX}'
          value: '50'
          description: 'Número máximo esperado de sessões VPN ativas'
        - macro: '{$UPTIME.MIN.WARN}'
          value: '600'
          description: 'Uptime mínimo em segundos — abaixo disso indica reboot recente'
      items:
        # ========================
        # SISTEMA
        # ========================
        - uuid: a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6
          name: 'Sistema: uptime do dispositivo'
          type: SNMP_AGENT
          snmp_oid: '1.3.6.1.2.1.1.3.0'
          key: 'system.uptime.mikrotik'
          delay: '60s'
          history: 30d
          trends: 365d
          units: uptime
          description: 'Tempo desde o último boot do roteador MikroTik'
          tags:
            - tag: component
              value: system
        - uuid: b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7
          name: 'Sistema: nome do dispositivo (sysName)'
          type: SNMP_AGENT
          snmp_oid: '1.3.6.1.2.1.1.5.0'
          key: 'system.name.mikrotik'
          delay: '1h'
          history: 7d
          trends: '0'
          value_type: CHAR
          description: 'Nome configurado no MikroTik (/system identity set name=...)'
          tags:
            - tag: component
              value: system
        - uuid: c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8
          name: 'Sistema: descrição (sysDescr / versão RouterOS)'
          type: SNMP_AGENT
          snmp_oid: '1.3.6.1.2.1.1.1.0'
          key: 'system.descr.mikrotik'
          delay: '1h'
          history: 7d
          trends: '0'
          value_type: CHAR
          description: 'Descrição do sistema — inclui versão do RouterOS e modelo do hardware'
          tags:
            - tag: component
              value: system
        - uuid: d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9
          name: 'Sistema: versão do RouterOS'
          type: SNMP_AGENT
          snmp_oid: '1.3.6.1.4.1.14988.1.1.4.4.0'
          key: 'routeros.version'
          delay: '1h'
          history: 30d
          trends: '0'
          value_type: CHAR
          description: |
            Versão atual do RouterOS instalada no dispositivo.
            MikroTik OID proprietário: mtxrLicVersion
            Use para monitorar se o firmware está atualizado.
          tags:
            - tag: component
              value: system
        - uuid: e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0
          name: 'Sistema: modelo do hardware'
          type: SNMP_AGENT
          snmp_oid: '1.3.6.1.4.1.14988.1.1.7.8.0'
          key: 'routeros.board.name'
          delay: '1h'
          history: 30d
          trends: '0'
          value_type: CHAR
          description: 'Modelo do hardware MikroTik (ex: RB941-2nD, RB4011, CCR2004)'
          tags:
            - tag: component
              value: system
        - uuid: f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1
          name: 'Sistema: número de série'
          type: SNMP_AGENT
          snmp_oid: '1.3.6.1.4.1.14988.1.1.7.3.0'
          key: 'routeros.serial.number'
          delay: '6h'
          history: 30d
          trends: '0'
          value_type: CHAR
          description: 'Número de série do hardware — útil para inventário'
          tags:
            - tag: component
              value: system
        # ========================
        # CPU
        # ========================
        - uuid: a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2
          name: 'CPU: uso total (%)'
          type: SNMP_AGENT
          snmp_oid: '1.3.6.1.2.1.25.3.3.1.2.1'
          key: 'system.cpu.util.mikrotik'
          delay: '60s'
          history: 7d
          trends: 365d
          units: '%'
          description: |
            Percentual de uso de CPU do RouterOS.
            OID padrão hrProcessorLoad (HOST-RESOURCES-MIB).
            Para MikroTik com múltiplos cores, este OID retorna a média geral.
          tags:
            - tag: component
              value: cpu
        - uuid: b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3
          name: 'CPU: frequência atual (MHz)'
          type: SNMP_AGENT
          snmp_oid: '1.3.6.1.4.1.14988.1.1.3.14.0'
          key: 'routeros.cpu.frequency'
          delay: '5m'
          history: 7d
          trends: 365d
          units: MHz
          description: 'Frequência atual do processador — OID proprietário MikroTik'
          tags:
            - tag: component
              value: cpu
        # ========================
        # MEMÓRIA
        # ========================
        - uuid: c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4
          name: 'Memória: total (bytes)'
          type: SNMP_AGENT
          snmp_oid: '1.3.6.1.2.1.25.2.3.1.5.65536'
          key: 'vm.memory.total.mikrotik'
          delay: '1h'
          history: 7d
          trends: 365d
          units: B
          description: 'Total de memória RAM instalada — HOST-RESOURCES-MIB hrStorageSize'
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '1024'
          tags:
            - tag: component
              value: memory
        - uuid: d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5
          name: 'Memória: em uso (bytes)'
          type: SNMP_AGENT
          snmp_oid: '1.3.6.1.2.1.25.2.3.1.6.65536'
          key: 'vm.memory.used.mikrotik'
          delay: '60s'
          history: 7d
          trends: 365d
          units: B
          description: 'Memória RAM em uso — HOST-RESOURCES-MIB hrStorageUsed'
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '1024'
          tags:
            - tag: component
              value: memory
        - uuid: e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6
          name: 'Memória: uso (%)'
          type: CALCULATED
          key: 'vm.memory.util.mikrotik'
          delay: '60s'
          history: 7d
          trends: 365d
          units: '%'
          params: 'last("vm.memory.used.mikrotik") / last("vm.memory.total.mikrotik") * 100'
          description: 'Percentual de memória RAM em uso'
          tags:
            - tag: component
              value: memory
        # ========================
        # DISCO (Storage Flash)
        # ========================
        - uuid: f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7
          name: 'Disco: espaço total (bytes)'
          type: SNMP_AGENT
          snmp_oid: '1.3.6.1.2.1.25.2.3.1.5.131072'
          key: 'vfs.disk.total.mikrotik'
          delay: '1h'
          history: 7d
          trends: 365d
          units: B
          description: 'Espaço total em disco/flash do RouterOS'
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '1024'
          tags:
            - tag: component
              value: storage
        - uuid: a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8
          name: 'Disco: espaço em uso (bytes)'
          type: SNMP_AGENT
          snmp_oid: '1.3.6.1.2.1.25.2.3.1.6.131072'
          key: 'vfs.disk.used.mikrotik'
          delay: '5m'
          history: 7d
          trends: 365d
          units: B
          description: 'Espaço em uso no disco/flash — inclui RouterOS, logs e backups'
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '1024'
          tags:
            - tag: component
              value: storage
        # ========================
        # TEMPERATURA
        # ========================
        - uuid: b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9
          name: 'Hardware: temperatura da CPU (°C)'
          type: SNMP_AGENT
          snmp_oid: '1.3.6.1.4.1.14988.1.1.3.11.0'
          key: 'sensor.temp.cpu.mikrotik'
          delay: '2m'
          history: 30d
          trends: 365d
          units: °C
          description: |
            Temperatura da CPU — OID proprietário MikroTik (mtxrHlCpuTemperature).
            Nem todos os modelos suportam este OID (depende do hardware).
            Modelos com sensor: RB4011, CCR, CRS3xx, RB1100.
          tags:
            - tag: component
              value: hardware
        - uuid: c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0
          name: 'Hardware: temperatura da placa (°C)'
          type: SNMP_AGENT
          snmp_oid: '1.3.6.1.4.1.14988.1.1.3.10.0'
          key: 'sensor.temp.board.mikrotik'
          delay: '2m'
          history: 30d
          trends: 365d
          units: °C
          description: |
            Temperatura da placa mãe — OID proprietário MikroTik (mtxrHlBoardTemperature).
            Disponível apenas em modelos com sensor de temperatura de placa.
          tags:
            - tag: component
              value: hardware
        # ========================
        # TENSÃO E ENERGIA
        # ========================
        - uuid: d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1
          name: 'Hardware: tensão de entrada (V)'
          type: SNMP_AGENT
          snmp_oid: '1.3.6.1.4.1.14988.1.1.3.8.0'
          key: 'sensor.voltage.mikrotik'
          delay: '5m'
          history: 30d
          trends: 365d
          units: V
          description: |
            Tensão de entrada do dispositivo — OID proprietário MikroTik (mtxrHlVoltage).
            O valor retornado é em decivolts — preprocessing divide por 10.
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.1'
          tags:
            - tag: component
              value: hardware
        # ========================
        # INTERFACES DE REDE (via LLD)
        # ========================
        - uuid: e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2
          name: 'Interfaces: descoberta automática'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#IFNAME},1.3.6.1.2.1.2.2.1.2,{#IFDESCR},1.3.6.1.2.1.2.2.1.2,{#IFTYPE},1.3.6.1.2.1.2.2.1.3,{#IFSPEED},1.3.6.1.2.1.2.2.1.5]'
          key: 'net.if.discovery'
          delay: '1h'
          description: |
            Descoberta automática de interfaces via SNMP (LLD).
            Cria automaticamente items e triggers para cada interface encontrada.
          tags:
            - tag: component
              value: network
        # ========================
        # WIRELESS
        # ========================
        - uuid: f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2c3
          name: 'Wireless: clientes conectados (total)'
          type: SNMP_AGENT
          snmp_oid: '1.3.6.1.4.1.14988.1.1.1.3.1.6.1'
          key: 'wireless.clients.total'
          delay: '60s'
          history: 30d
          trends: 365d
          description: |
            Número total de clientes wireless conectados na interface wlan1.
            OID proprietário MikroTik (mtxrWlApClientCount).
            Para múltiplas interfaces wireless, ajuste o índice (.1 = wlan1, .2 = wlan2).
          tags:
            - tag: component
              value: wireless
        - uuid: a9b0c1d2e3f4a5b6c7d8e9f0a1b2c3d4
          name: 'Wireless: frequência operacional (MHz)'
          type: SNMP_AGENT
          snmp_oid: '1.3.6.1.4.1.14988.1.1.1.3.1.7.1'
          key: 'wireless.frequency'
          delay: '5m'
          history: 7d
          trends: 365d
          units: MHz
          description: 'Frequência do canal wireless em uso (ex: 2412 = canal 1, 5180 = canal 36)'
          tags:
            - tag: component
              value: wireless
        - uuid: b0c1d2e3f4a5b6c7d8e9f0a1b2c3d4e5
          name: 'Wireless: intensidade do sinal (dBm)'
          type: SNMP_AGENT
          snmp_oid: '1.3.6.1.4.1.14988.1.1.1.3.1.4.1'
          key: 'wireless.signal.strength'
          delay: '60s'
          history: 30d
          trends: 365d
          units: dBm
          description: |
            Intensidade do sinal wireless da interface wlan1 (dBm).
            Valores de referência:
              -50 dBm ou mais: excelente
              -60 a -50 dBm: bom
              -70 a -60 dBm: razoável
              abaixo de -70 dBm: fraco
          tags:
            - tag: component
              value: wireless
        # ========================
        # VPN — Sessões ativas
        # ========================
        - uuid: c1d2e3f4a5b6c7d8e9f0a1b2c3d4e5f6
          name: 'VPN: sessões L2TP ativas'
          type: SNMP_AGENT
          snmp_oid: '1.3.6.1.4.1.14988.1.1.2.1.1.1'
          key: 'vpn.l2tp.sessions.active'
          delay: '60s'
          history: 30d
          trends: 365d
          description: |
            Número de sessões L2TP/IPsec ativas no momento.
            OID proprietário MikroTik (mtxrPPPActiveSessions).
          tags:
            - tag: component
              value: vpn
        # ========================
        # ROTEAMENTO
        # ========================
        - uuid: d2e3f4a5b6c7d8e9f0a1b2c3d4e5f6a7
          name: 'Roteamento: número de rotas na tabela'
          type: SNMP_AGENT
          snmp_oid: '1.3.6.1.2.1.4.1.0'
          key: 'routing.table.count'
          delay: '5m'
          history: 30d
          trends: 365d
          description: |
            Número total de entradas na tabela de roteamento IP.
            Queda brusca pode indicar perda de rotas (BGP, OSPF ou estáticas).
          tags:
            - tag: component
              value: routing
        - uuid: e3f4a5b6c7d8e9f0a1b2c3d4e5f6a7b8
          name: 'Roteamento: IP forwarding habilitado'
          type: SNMP_AGENT
          snmp_oid: '1.3.6.1.2.1.4.1.0'
          key: 'ip.forwarding.enabled'
          delay: '5m'
          history: 7d
          trends: '0'
          description: |
            Verifica se o IP forwarding está habilitado (1 = sim, 2 = não).
            Deve sempre ser 1 em um roteador ativo.
          tags:
            - tag: component
              value: routing
        # ========================
        # SNMP — Disponibilidade
        # ========================
        - uuid: f4a5b6c7d8e9f0a1b2c3d4e5f6a7b8c9
          name: 'SNMP: disponibilidade do agente'
          type: ZABBIX_INTERNAL
          key: 'zabbix[host,snmp,available]'
          delay: '60s'
          history: 7d
          trends: 365d
          description: 'Status de disponibilidade SNMP do host MikroTik no Zabbix'
          tags:
            - tag: component
              value: zabbix
      triggers:
        # ========================
        # SISTEMA
        # ========================
        - uuid: a5b6c7d8e9f0a1b2c3d4e5f6a7b8c9d0
          expression: 'last(/MikroTik SNMP - JPLS/system.uptime.mikrotik) < {$UPTIME.MIN.WARN}'
          name: 'MikroTik: dispositivo reiniciado recentemente ({HOST.NAME})'
          opdata: 'Uptime: {ITEM.LASTVALUE}'
          priority: WARNING
          description: |
            O roteador MikroTik foi reiniciado há menos de 10 minutos.
            Verifique se foi intencional (atualização, queda de energia) ou falha.
          tags:
            - tag: scope
              value: availability
        - uuid: b6c7d8e9f0a1b2c3d4e5f6a7b8c9d0e1
          expression: 'last(/MikroTik SNMP - JPLS/zabbix[host,snmp,available]) = 0'
          name: 'MikroTik: SNMP indisponível ({HOST.NAME})'
          priority: HIGH
          description: |
            O Zabbix não consegue coletar dados SNMP do MikroTik.
            Verifique: SNMP habilitado no roteador, community correta, firewall bloqueando UDP/161.
          tags:
            - tag: scope
              value: availability
        # ========================
        # CPU
        # ========================
        - uuid: c7d8e9f0a1b2c3d4e5f6a7b8c9d0e1f2
          expression: 'avg(/MikroTik SNMP - JPLS/system.cpu.util.mikrotik,5m) >= {$CPU.UTIL.CRIT}'
          name: 'MikroTik: CPU crítica (> {$CPU.UTIL.CRIT}%) em {HOST.NAME}'
          opdata: 'CPU atual: {ITEM.LASTVALUE}'
          priority: HIGH
          description: |
            O uso de CPU do MikroTik está acima do limite crítico por 5 minutos.
            Causas comuns: excesso de conexões, firewall com muitas regras, ataque DDoS, download de update.
          tags:
            - tag: scope
              value: performance
        - uuid: d8e9f0a1b2c3d4e5f6a7b8c9d0e1f2a3
          expression: 'avg(/MikroTik SNMP - JPLS/system.cpu.util.mikrotik,5m) >= {$CPU.UTIL.WARN} and avg(/MikroTik SNMP - JPLS/system.cpu.util.mikrotik,5m) < {$CPU.UTIL.CRIT}'
          name: 'MikroTik: CPU elevada (> {$CPU.UTIL.WARN}%) em {HOST.NAME}'
          opdata: 'CPU atual: {ITEM.LASTVALUE}'
          priority: WARNING
          dependencies:
            - name: 'MikroTik: CPU crítica (> {$CPU.UTIL.CRIT}%) em {HOST.NAME}'
              expression: 'avg(/MikroTik SNMP - JPLS/system.cpu.util.mikrotik,5m) >= {$CPU.UTIL.CRIT}'
          tags:
            - tag: scope
              value: performance
        # ========================
        # MEMÓRIA
        # ========================
        - uuid: e9f0a1b2c3d4e5f6a7b8c9d0e1f2a3b4
          expression: 'last(/MikroTik SNMP - JPLS/vm.memory.util.mikrotik) >= {$MEMORY.UTIL.CRIT}'
          name: 'MikroTik: memória crítica (> {$MEMORY.UTIL.CRIT}%) em {HOST.NAME}'
          opdata: 'Memória em uso: {ITEM.LASTVALUE}'
          priority: HIGH
          description: |
            Memória RAM acima do limite crítico.
            Em roteadores MikroTik com pouca RAM (32-64MB), isto pode causar instabilidade.
          tags:
            - tag: scope
              value: capacity
        - uuid: f0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5
          expression: 'last(/MikroTik SNMP - JPLS/vm.memory.util.mikrotik) >= {$MEMORY.UTIL.WARN} and last(/MikroTik SNMP - JPLS/vm.memory.util.mikrotik) < {$MEMORY.UTIL.CRIT}'
          name: 'MikroTik: memória elevada (> {$MEMORY.UTIL.WARN}%) em {HOST.NAME}'
          opdata: 'Memória em uso: {ITEM.LASTVALUE}'
          priority: WARNING
          dependencies:
            - name: 'MikroTik: memória crítica (> {$MEMORY.UTIL.CRIT}%) em {HOST.NAME}'
              expression: 'last(/MikroTik SNMP - JPLS/vm.memory.util.mikrotik) >= {$MEMORY.UTIL.CRIT}'
          tags:
            - tag: scope
              value: capacity
        # ========================
        # TEMPERATURA
        # ========================
        - uuid: a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5e6
          expression: 'last(/MikroTik SNMP - JPLS/sensor.temp.cpu.mikrotik) >= {$TEMP.MAX.CRIT}'
          name: 'MikroTik: temperatura crítica da CPU ({$TEMP.MAX.CRIT}°C) em {HOST.NAME}'
          opdata: 'Temperatura: {ITEM.LASTVALUE}'
          priority: HIGH
          description: |
            Temperatura da CPU acima do limite crítico.
            Risco de throttling ou dano ao hardware. Verifique ventilação e ambiente do equipamento.
          tags:
            - tag: scope
              value: hardware
        - uuid: b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6f7
          expression: 'last(/MikroTik SNMP - JPLS/sensor.temp.cpu.mikrotik) >= {$TEMP.MAX.WARN} and last(/MikroTik SNMP - JPLS/sensor.temp.cpu.mikrotik) < {$TEMP.MAX.CRIT}'
          name: 'MikroTik: temperatura da CPU elevada (> {$TEMP.MAX.WARN}°C) em {HOST.NAME}'
          opdata: 'Temperatura: {ITEM.LASTVALUE}'
          priority: WARNING
          dependencies:
            - name: 'MikroTik: temperatura crítica da CPU ({$TEMP.MAX.CRIT}°C) em {HOST.NAME}'
